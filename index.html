<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mother and Child Health Care Center in Riga. Pediatric care, services, prices, opening hours, and appointment contact information." />
    <meta name="theme-color" content="#eaf2e1" />
    <title>Mother and Child Health Care Center</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content" data-key="skip-content">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="#home">
        <span class="brand-mark" aria-hidden="true">m<span>+</span></span>
        <span class="brand-name" data-key="site-name">Mother and Child Health Care Center</span>
      </a>
      <div class="header-controls">
        <button id="menu-toggle" class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation">
          <span class="menu-toggle-icon" aria-hidden="true"></span>
          <span data-key="menu-toggle">Menu</span>
        </button>
        <div class="language-selector" role="group" aria-label="Language" data-aria-key="language-selector">
          <button class="language-button" type="button" data-lang="lv" lang="lv" aria-label="Latviešu" aria-pressed="false">LV</button>
          <button class="language-button" type="button" data-lang="en" lang="en" aria-label="English" aria-pressed="true">EN</button>
        </div>
      </div>
      <nav id="primary-navigation" aria-label="Main navigation" data-aria-key="primary-navigation">
        <ul>
          <li><a href="#home" class="menu-item" data-section="home" data-key="home">Home</a></li>
          <li><a href="#services" class="menu-item" data-section="services" data-key="services">Services</a></li>
          <li><a href="#pricelist" class="menu-item" data-section="pricelist" data-key="pricelist">Price List</a></li>
          <li><a href="#gallery" class="menu-item" data-section="gallery" data-key="gallery-menu">Gallery</a></li>
          <li><a href="#about" class="menu-item" data-section="about" data-key="about-menu">About Us</a></li>
          <li><a href="#contacts" class="menu-item" data-section="contacts" data-key="contacts">Contacts</a></li>
        </ul>
      </nav>
    </header>
    <main id="main-content" tabindex="-1"></main>
    <noscript><p class="noscript-message">Please enable JavaScript to view the clinic information. For appointments, call <a href="tel:+37129456983">+371 29456983</a>.</p></noscript>
    <dialog id="lightbox" class="lightbox" aria-labelledby="lightbox-title" aria-describedby="lightbox-caption">
      <div class="lightbox-toolbar">
        <h2 id="lightbox-title" data-key="gallery-title">Gallery</h2>
        <button class="lightbox-close" type="button" aria-label="Close gallery" data-aria-key="gallery-close" autofocus><span aria-hidden="true">&times;</span></button>
      </div>
      <div class="lightbox-stage"><img class="lightbox-img" alt="" /></div>
      <div class="lightbox-controls">
        <button class="lightbox-prev" type="button" aria-label="Previous image" data-aria-key="gallery-prev"><span aria-hidden="true">&#10094;</span></button>
        <p id="lightbox-caption" aria-live="polite"></p>
        <button class="lightbox-next" type="button" aria-label="Next image" data-aria-key="gallery-next"><span aria-hidden="true">&#10095;</span></button>
      </div>
    </dialog>
    <footer class="site-footer">
      <p>© <span class="current-year">2026</span> Mātes un bērna veselības aprūpes centrs</p>
      <a href="tel:+37129456983">+371 29456983</a>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
